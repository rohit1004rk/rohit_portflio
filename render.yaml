services:
  - type: web
    name: rohit-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix server install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
