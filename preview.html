<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rohit Kumar — Full Stack + AI/ML Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0f14;
        --surface: #111820;
        --surface-2: #18212c;
        --surface-3: #1f2a37;
        --border: #273342;
        --border-soft: rgba(148, 163, 184, 0.14);
        --text: #f1f5f9;
        --text-2: #94a3b8;
        --text-3: #64748b;
        --accent: #ffb454;
        --accent-soft: rgba(255, 180, 84, 0.12);
        --accent-border: rgba(255, 180, 84, 0.32);
        --teal: #4fd8c4;
        --teal-soft: rgba(79, 216, 196, 0.12);
        --teal-border: rgba(79, 216, 196, 0.32);
        --error: #ff6b6b;
        --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
        --font-mono:
          "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;
        --space-20: 80px;
        --container-max: 1240px;
        --container-pad: 24px;
        --section-pad: 112px;
        --nav-height: 72px;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-full: 999px;
        --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.45);
        --shadow-accent: 0 8px 28px rgba(255, 180, 84, 0.22);
        --t-fast: 150ms ease;
        --t-med: 250ms ease;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      ::selection {
        background: rgba(255, 180, 84, 0.28);
      }
      a {
        color: var(--accent);
        text-decoration: none;
        transition: color var(--t-fast);
      }
      a:hover {
        color: var(--text);
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--font-display);
        line-height: 1.1;
        letter-spacing: -0.02em;
        font-weight: 700;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      .container {
        max-width: var(--container-max);
        margin: 0 auto;
        padding: 0 var(--container-pad);
      }
      .section {
        padding: var(--section-pad) 0;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--teal);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .eyebrow::before {
        content: "";
        width: 24px;
        height: 1px;
        background: var(--teal);
      }
      .section-head {
        margin-bottom: 48px;
        max-width: 720px;
      }
      .section-head h2 {
        font-size: 44px;
        margin-top: 16px;
      }
      .section-head .lead {
        color: var(--text-2);
        font-size: 18px;
        line-height: 1.75;
        margin-top: 16px;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .tech-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            900px 500px at 85% -10%,
            rgba(79, 216, 196, 0.06),
            transparent 60%
          ),
          radial-gradient(
            800px 480px at 0% 110%,
            rgba(255, 180, 84, 0.05),
            transparent 60%
          );
      }
      .tech-bg::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.035) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(148, 163, 184, 0.035) 1px,
            transparent 1px
          );
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(
          ellipse 80% 60% at 50% 0%,
          black 30%,
          transparent 75%
        );
        mask-image: radial-gradient(
          ellipse 80% 60% at 50% 0%,
          black 30%,
          transparent 75%
        );
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 13px 24px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid transparent;
        transition: all var(--t-med);
        line-height: 1;
        white-space: nowrap;
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .btn-primary {
        background: var(--accent);
        color: #0b0f14;
      }
      .btn-primary:hover {
        background: #ffc06e;
        color: #0b0f14;
        transform: translateY(-2px);
        box-shadow: var(--shadow-accent);
      }
      .btn-ghost {
        background: transparent;
        color: var(--text);
        border-color: var(--border);
      }
      .btn-ghost:hover {
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-2px);
      }
      .btn-teal {
        background: var(--teal);
        color: #0b0f14;
      }
      .btn-teal:hover {
        background: #6fe3d1;
        color: #0b0f14;
        transform: translateY(-2px);
      }
      .btn-sm {
        padding: 9px 16px;
        font-size: 14px;
      }
      .nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        height: var(--nav-height);
        background: rgba(11, 15, 20, 0.82);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border-soft);
      }
      .nav-inner {
        max-width: var(--container-max);
        margin: 0 auto;
        padding: 0 var(--container-pad);
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--text);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 18px;
      }
      .brand:hover {
        color: var(--text);
      }
      .brand .logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--accent);
        color: #0b0f14;
        display: grid;
        place-items: center;
        font-family: var(--font-mono);
        font-weight: 700;
      }
      .brand small {
        display: block;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--text-3);
        font-weight: 500;
      }
      .nav-links {
        display: flex;
        align-items: center;
        gap: 4px;
        list-style: none;
      }
      .nav-links a {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-2);
      }
      .nav-links a:hover {
        color: var(--text);
        background: rgba(148, 163, 184, 0.08);
      }
      .nav-links a.active {
        color: var(--accent);
      }
      .nav-links .nav-cta {
        margin-left: 8px;
        background: var(--accent);
        color: #0b0f14;
        font-weight: 600;
        padding: 8px 16px;
      }
      .nav-links .nav-cta:hover {
        background: #ffc06e;
        color: #0b0f14;
      }
      .burger {
        display: none;
        flex-direction: column;
        gap: 5px;
        background: none;
        border: 0;
        padding: 8px;
        z-index: 110;
      }
      .burger span {
        width: 22px;
        height: 2px;
        background: var(--text);
        border-radius: 2px;
        transition: all var(--t-med);
      }
      .burger.open span:nth-child(1) {
        transform: translateY(7px) rotate(45deg);
      }
      .burger.open span:nth-child(2) {
        opacity: 0;
      }
      .burger.open span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
      }
      .hero {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: calc(var(--nav-height) + 48px) 0 80px;
        overflow: hidden;
      }
      #nn {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .hero .container {
        position: relative;
        z-index: 2;
      }
      .hero-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 64px;
        align-items: center;
      }
      .hero h1 {
        font-size: 64px;
        margin: 20px 0 16px;
        line-height: 1.08;
      }
      .hero h1 .accent {
        color: var(--accent);
      }
      .hero .role-line {
        font-family: var(--font-mono);
        font-size: 18px;
        color: var(--teal);
        margin-bottom: 20px;
      }
      .hero .desc {
        color: var(--text-2);
        font-size: 18px;
        line-height: 1.75;
        max-width: 560px;
        margin-bottom: 32px;
      }
      .hero-ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 48px;
      }
      .hero-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        max-width: 560px;
      }
      .stat {
        border-left: 2px solid var(--border);
        padding-left: 16px;
      }
      .stat .num {
        font-family: var(--font-display);
        font-size: 36px;
        font-weight: 700;
      }
      .stat .num em {
        font-style: normal;
        color: var(--accent);
      }
      .stat .lbl {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-3);
        margin-top: 4px;
      }
      .terminal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        transform: rotate(1deg);
      }
      .term-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
      }
      .term-bar .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .term-bar .dot:nth-child(1) {
        background: #ff5f57;
      }
      .term-bar .dot:nth-child(2) {
        background: #febc2e;
      }
      .term-bar .dot:nth-child(3) {
        background: #28c840;
      }
      .term-bar .title {
        margin-left: 8px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-3);
      }
      .term-body {
        padding: 20px;
        font-family: var(--font-mono);
        font-size: 14px;
        line-height: 1.8;
        min-height: 300px;
      }
      .term-line {
        display: flex;
        gap: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .term-line .no {
        color: var(--text-3);
        user-select: none;
        min-width: 18px;
        text-align: right;
      }
      .term-line .prompt {
        color: var(--teal);
      }
      .term-line .ok {
        color: var(--teal);
      }
      .term-line .dim {
        color: var(--text-3);
      }
      .term-line .out {
        color: var(--text-2);
      }
      .term-cursor {
        display: inline-block;
        width: 8px;
        height: 15px;
        background: var(--accent);
        vertical-align: -2px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .page-hero {
        padding: calc(var(--nav-height) + 80px) 0 64px;
        border-bottom: 1px solid var(--border-soft);
      }
      .page-hero h1 {
        font-size: 56px;
        margin-top: 16px;
      }
      .page-hero .lead {
        color: var(--text-2);
        font-size: 18px;
        line-height: 1.75;
        max-width: 680px;
        margin-top: 16px;
      }
      .projects-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
      .skills-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        transition: all var(--t-med);
        position: relative;
        overflow: hidden;
      }
      .card:hover {
        border-color: var(--accent-border);
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
      }
      .card .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .card .card-icon {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        display: grid;
        place-items: center;
        font-size: 22px;
      }
      .card h3 {
        font-size: 22px;
        margin-bottom: 12px;
      }
      .card .card-cat {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--teal);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }
      .card p {
        color: var(--text-2);
        font-size: 14px;
        line-height: 1.75;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 500;
        padding: 5px 12px;
        border-radius: 999px;
        white-space: nowrap;
      }
      .badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .badge-completed {
        color: var(--teal);
        background: var(--teal-soft);
        border: 1px solid var(--teal-border);
      }
      .badge-in-progress {
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
      }
      .badge-prototype {
        color: var(--teal);
        background: var(--teal-soft);
        border: 1px solid var(--teal-border);
      }
      .badge-learning {
        color: #a5b4fc;
        background: rgba(165, 180, 252, 0.12);
        border: 1px solid rgba(165, 180, 252, 0.32);
      }
      .tech-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }
      .tech-tag {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-2);
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 4px 10px;
        border-radius: 6px;
      }
      .skill-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        transition: all var(--t-med);
      }
      .skill-card:hover {
        border-color: var(--accent-border);
        transform: translateY(-3px);
      }
      .skill-card h3 {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        margin-bottom: 20px;
      }
      .skill-card h3 .ic {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 18px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
      }
      .skill-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .skill-chips span {
        font-size: 14px;
        color: var(--text-2);
        background: var(--surface-2);
        border: 1px solid var(--border);
        padding: 7px 13px;
        border-radius: 6px;
        transition: all var(--t-fast);
      }
      .skill-chips span:hover {
        color: var(--teal);
        border-color: var(--teal-border);
        transform: translateY(-1px);
      }
      .about-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 64px;
        align-items: start;
      }
      .about-text p {
        color: var(--text-2);
        font-size: 18px;
        line-height: 1.75;
        margin-bottom: 20px;
      }
      .about-text p strong {
        color: var(--text);
      }
      .focus-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .focus-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px;
      }
      .focus-card h4 {
        font-size: 16px;
        margin-bottom: 8px;
        color: var(--accent);
      }
      .focus-card p {
        color: var(--text-2);
        font-size: 14px;
        line-height: 1.75;
      }
      .ach-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        list-style: none;
      }
      .ach-list li {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 20px;
        color: var(--text-2);
        font-weight: 500;
        font-size: 14px;
      }
      .ach-list .ck {
        width: 26px;
        height: 26px;
        flex: none;
        border-radius: 6px;
        background: var(--teal-soft);
        border: 1px solid var(--teal-border);
        display: grid;
        place-items: center;
        color: var(--teal);
        font-size: 12px;
      }
      .timeline-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        display: flex;
        gap: 20px;
      }
      .timeline-card .yr {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--accent);
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        padding: 6px 12px;
        border-radius: 6px;
        height: fit-content;
        white-space: nowrap;
      }
      .timeline-card h3 {
        font-size: 22px;
        margin-bottom: 8px;
      }
      .timeline-card .where {
        color: var(--teal);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
      }
      .timeline-card p {
        color: var(--text-2);
        font-size: 14px;
        line-height: 1.75;
      }
      .resume-block {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        margin-bottom: 24px;
      }
      .resume-block h3 {
        font-size: 22px;
        color: var(--accent);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .resume-block .entry {
        padding: 16px 0;
        border-bottom: 1px solid var(--border-soft);
      }
      .resume-block .entry:last-child {
        border-bottom: 0;
      }
      .resume-block .entry h4 {
        font-size: 16px;
      }
      .resume-block .entry .meta {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--teal);
        margin: 4px 0 8px;
      }
      .resume-block .entry p {
        color: var(--text-2);
        font-size: 14px;
        line-height: 1.75;
      }
      .contact-grid {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 64px;
        align-items: start;
      }
      .contact-links {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .contact-links a {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text-2);
        font-weight: 600;
        font-size: 14px;
        transition: all var(--t-med);
      }
      .contact-links a:hover {
        color: var(--text);
        border-color: var(--accent-border);
        transform: translateX(4px);
      }
      .contact-links .em {
        font-size: 22px;
      }
      .contact-links .ar {
        margin-left: auto;
        color: var(--text-3);
      }
      .form {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .form label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-2);
        margin-bottom: 8px;
        display: block;
      }
      .form input,
      .form textarea {

      function initTerminal() {
        var body = $("#termBody");
        if (!body) return;
        var reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        if (reduce) {
          body.innerHTML =
            terminalLines
              .map(function (l, i) {
                return (
                  '<div class="term-line"><span class="no">' +
                  (i + 1) +
                  '</span><span><span class="prompt">&gt;</span> <span class="' +
                  (l.type === "ok" ? "ok" : "out") +
                  '">' +
                  esc(l.text) +
                  "</span></span></div>"
                );
              })
              .join("") +
            '<div class="term-line"><span class="no">' +
            (terminalLines.length + 1) +
            '</span><span class="dim"># visual-only · connect via /contact</span></div>';
          return;
        }
        var li = 0,
          ci = 0,
          shown = [],
          typed = "",
          done = false,
          timer;
        function render() {
          var html = shown
            .map(function (l, i) {
              return (
                '<div class="term-line"><span class="no">' +
                (i + 1) +
                '</span><span><span class="prompt">&gt;</span> <span class="' +
                (l.type === "ok" ? "ok" : "out") +
                '">' +
                esc(l.text) +
                "</span></span></div>"
              );
            })
            .join("");
          if (!done) {
            html +=
              '<div class="term-line"><span class="no">' +
              (shown.length + 1) +
              '</span><span><span class="prompt">&gt;</span> ' +
              esc(typed) +
              '<span class="term-cursor"></span></span></div>';
          } else {
            html +=
              '<div class="term-line"><span class="no">' +
              (shown.length + 1) +
              '</span><span class="dim"># visual-only · connect via /contact</span></div>';
          }
          body.innerHTML = html;
        }
        function step() {
          var line = terminalLines[li];
          if (!line) {
            done = true;
            render();
            return;
          }
          if (ci <= line.text.length) {
            typed = line.text.slice(0, ci);
            ci++;
            render();
            timer = setTimeout(step, 26);
          } else {
            shown.push(line);
            typed = "";
            li++;
            ci = 0;
            render();
            timer = setTimeout(step, 300);
          }
        }
        timer = setTimeout(step, 400);
      }
      function initNetwork() {
        var cv = $("#nn");
        if (!cv) return;
        var ctx = cv.getContext("2d");
        var reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        var W,
          H,
          pts = [],
          raf;
        var colors = ["255,180,84", "79,216,196", "148,163,184"];
        function resize() {
          W = cv.width = cv.offsetWidth;
          H = cv.height = cv.offsetHeight;
          pts = [];
          for (var i = 0; i < 60; i++) {
            pts.push({
              x: Math.random() * W,
              y: Math.random() * H,
              vx: (Math.random() - 0.5) * 0.4,
              vy: (Math.random() - 0.5) * 0.4,
              r: Math.random() * 1.5 + 0.8,
            });
          }
        }
        resize();
        window.addEventListener("resize", resize);
        function draw() {
          ctx.clearRect(0, 0, W, H);
          for (var i = 0; i < pts.length; i++) {
            for (var j = i + 1; j < pts.length; j++) {
              var a = pts[i],
                b = pts[j],
                dx = a.x - b.x,
                dy = a.y - b.y,
                d = Math.hypot(dx, dy);
              if (d < 120) {
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle =
                  "rgba(79,216,196," + 0.1 * (1 - d / 120) + ")";
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }
          for (var k = 0; k < pts.length; k++) {
            var p = pts[k];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, 7);
            ctx.fillStyle =
              "rgba(" +
              colors[Math.floor(Math.random() * colors.length)] +
              ",0.5)";
            ctx.fill();
          }
        }
        function tick() {
          for (var i = 0; i < pts.length; i++) {
            var p = pts[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1;
            if (p.y < 0 || p.y > H) p.vy *= -1;
          }
          draw();
          raf = requestAnimationFrame(tick);
        }
        if (reduce) {
          draw();
        } else {
          tick();
        }
      }
      function initReveal() {
        var io = new IntersectionObserver(
          function (es) {
            es.forEach(function (e) {
              if (e.isIntersecting) {
                e.target.classList.add("in");
                io.unobserve(e.target);
              }
            });
          },
          { threshold: 0.12 },
        );
        document.querySelectorAll(".reveal").forEach(function (el) {
          io.observe(el);
        });
      }
